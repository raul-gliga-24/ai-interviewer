services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Keys come from .env.local — the same file `npm run dev` reads, so there
    # is one place to put them. Nothing secret is baked into the image.
    # Declaring them under `environment:` as well would override this file with
    # empty values whenever the shell doesn't define them.
    env_file:
      - path: .env.local
        required: false
    volumes:
      # Interviews survive rebuilds and restarts.
      - ./data:/app/data
